[project]
name = "lighthouse"
version = "0.0.0"
description = "Test lane for the hooks, helpers and scripts in this repository."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network_stays_red: a network error in this test's failure is no skip (tests/pack/_network.py, #338)",
]
