[project]
language = "nl"
code_language = "en"
code_language_paths = ["pack/**", "internal/**", "cmd/**", "tests/**", "tools/**"]
code_language_exempt = ["tests/pack/fixtures/code_language/**"]

[forge]
kind = "github"
repo = "CorneeldH/lighthouse"

[forge.board]
project_number = 2
project_id = "PVT_kwHOAGmU3s4Bnmdy"
status_field_id = "PVTSSF_lAHOAGmU3s4BnmdyzhmKS68"
priority_field_id = "PVTSSF_lAHOAGmU3s4BnmdyzhmKS9I"

[forge.board.status_options]
"To do" = "5995ef76"
"In progress" = "5c4502d5"
"Done" = "4a797cd3"
"On hold" = "6a2f466b"
"Controller" = "7c834c1d"

[forge.board.priority_options]
P0 = "e78d8910"
P1 = "5866e321"
P2 = "321d79fc"

[labels]
blocked_issue = "3-blocked-issue"
blocked_external = "3-blocked-external"
needs_shaping = "3-needs-shaping"
needs_decision = "3-needs-decision"
needs_hands = "3-needs-hands"
needs_testing = "3-needs-testing"
area_prefix = "2-area:"

[paths]
labels = "docs/developer/labels.md"

[test_gate]
# gate_go.py, gate_python.py and gate_node.py choose the Go packages, the pytest files and the
# web checks of the commit (see the scripts).
command = "python3 .lighthouse/scripts/gate_go.py -- go test -race && python3 pack/python/scripts/gate_python.py -- uv run pytest -q && python3 .lighthouse/scripts/gate_node.py --dir web --also .github/workflows/ci.yml --also lighthouse.toml --drift gen=src/api -- lint typecheck test"
# 3: a selector could not check, so nothing was tested (see the scripts).
unchecked_exit_codes = [3]
