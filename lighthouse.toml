[project]
language = "nl"
code_language = "en"
code_language_paths = ["pack/**", "internal/**", "cmd/**", "tests/**", "tools/**"]
code_language_exempt = ["tests/pack/fixtures/code_language/**"]

[forge]
kind = "github"
repo = "CorneeldH/lighthouse"

[test_gate]
# gate_go.py and gate_python.py choose the Go packages and pytest files of the commit;
# ci/domains.py runs the web checks when the commit touches web (see the scripts).
command = "python3 .lighthouse/scripts/gate_go.py -- go test -race && python3 pack/python/scripts/gate_python.py -- uv run pytest -q && python3 ci/domains.py gate"
# 3: ci/domains.py could not check (no node, no web/node_modules, a command not found).
unchecked_exit_codes = [3]
