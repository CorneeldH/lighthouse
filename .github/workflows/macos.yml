# The macOS gate for lighthouse (#337): the pack-python pytest job, the Go race tests and the
# e2e tests on macos-latest. A pull request to main never runs it. A pull request to a
# release/* branch does, so the maintainer sees the result before the merge of a release PR; and
# release.yml calls it with the commit it will tag, so a release needs a green macOS run of that
# commit. Start it by hand (workflow_dispatch) on a branch whose change touches portability.
name: macos

on:
  pull_request:
    branches: ["release/**"]
  workflow_call:
    inputs:
      ref:
        description: Commit to test; empty tests the commit of the caller
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-python:
    runs-on: macos-latest
    # macOS runners are slower than ubuntu-latest (#90).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # The `lighthouse_bin` fixture builds cmd/lighthouse: skills and pack/python call it (#274).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      # The same run as the pack-python job in ci.yml.
      - run: uv run pytest -n auto tests/pack/python/

  go-test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Same flags as the Go part of [test_gate] command; internal/repopins/workflows_test.go pins it.
      - run: go test -race -shuffle=on ./...

  go-e2e:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The e2e tests of pack/python run the default test command, `uv run pytest -q`.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: go test -race -shuffle=on -tags e2e ./e2e/ -v
