# The macOS gate for lighthouse (#337): the pack-python pytest job, the Go race tests and the
# e2e tests on macos-latest. A pull request never runs it: release.yml calls it before every
# release, so a release needs a green macOS run of its commit. Start it by hand
# (workflow_dispatch) on a branch whose change touches portability.
name: macos

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-python:
    runs-on: macos-latest
    # macOS runners are slower than ubuntu-latest (#90).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The `lighthouse_bin` fixture builds cmd/lighthouse: skills and pack/python call it (#274).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # The same run as the pack-python job in ci.yml.
      - run: uv run pytest -n auto tests/pack/python/

  go-test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same flags as the Go part of [test_gate] command; internal/repopins/workflows_test.go pins it.
      - run: go test -race -shuffle=on ./...

  go-e2e:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The e2e tests of pack/python run the default test command, `uv run pytest -q`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: go test -race -shuffle=on -tags e2e ./e2e/ -v
