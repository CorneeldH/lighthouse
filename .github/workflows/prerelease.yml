# Pre-release for lighthouse: puts the built SPA in a commit that only the tag points at and
# pushes just that tag, then calls build.yml. build.yml fails on a tag without dist, so a
# pre-release tag made by hand would fail the build; this workflow is the way to make one.
# The tag is vX.Y.Z-dev.N, -rc.N or -test.N; a release tag is made by release.yml only.
# dev-build.yml and release-train.yml call it for -dev and -rc. Started by hand it makes only a
# -test build: without a tag it counts the next -test.N itself (`changelog next --kind test`).
# In a called run `github.workflow` is the name of the caller, in a manual run it is `prerelease`.
name: prerelease

on:
  workflow_call:
    inputs:
      tag:
        description: Pre-release tag, vX.Y.Z-dev.N or vX.Y.Z-rc.N
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Test tag vX.Y.Z-test.N; empty counts the next one
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Builds the SPA in a job with read rights only; the writing job below gets just the artifact.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check tag form
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          # A manual run without a tag counts its -test tag in the tag job.
          if [ -z "$TAG" ] && [ "$WORKFLOW" = prerelease ]; then exit 0; fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(dev|rc|test)\.[0-9]+$'; then
            echo "prerelease: '$TAG' is not a pre-release tag vX.Y.Z-dev.N, -rc.N or -test.N" >&2
            exit 1
          fi
          # A manual run makes test builds only; dev and rc come from the workflows that call this one.
          if [ "$WORKFLOW" = prerelease ] && ! printf '%s\n' "$TAG" | grep -Eq -- '-test\.[0-9]+$'; then
            echo "prerelease: a manual run makes -test tags only, not '$TAG'" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: internal/web/dist
          if-no-files-found: error
          include-hidden-files: true

  tag:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # The only job that pushes: git needs the token in .git/config for the push.
          persist-credentials: true
      # Outside the worktree: the script replaces internal/web/dist there.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ${{ runner.temp }}/ui-dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: tag
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          tag=$TAG
          if [ -z "$tag" ] && [ "$WORKFLOW" = prerelease ]; then
            tag=$(go run ./ci/changelog next --kind test)
          fi
          # The real gate for the write token: ui checked the form too, but only this job pushes.
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(dev|rc|test)\.[0-9]+$'; then
            echo "prerelease: '$tag' is not a pre-release tag vX.Y.Z-dev.N, -rc.N or -test.N" >&2
            exit 1
          fi
          if [ "$WORKFLOW" = prerelease ] && ! printf '%s\n' "$tag" | grep -Eq -- '-test\.[0-9]+$'; then
            echo "prerelease: a manual run makes -test tags only, not '$tag'" >&2
            exit 1
          fi
          # Exit 2 means no such tag; any other failure is an error, not a free name.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "prerelease: tag $tag already exists on the remote" >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "prerelease: could not check the remote for tag $tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          ci/tag-with-ui.sh "$tag" "$RUNNER_TEMP/ui-dist"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN triggers no push workflow, so build.yml is called directly.
  build:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
