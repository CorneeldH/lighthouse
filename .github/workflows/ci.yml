# CI for lighthouse: the Go lane (golangci-lint, go test) and the Python lane for the
# hooks, helpers and scripts.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: ci/literal-grep.sh

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # Same flags as the Go part of [test_gate] command; tests/test_ci_go_test_pin.py pins it.
      - run: go test -shuffle=on ./...
      # The e2e tests of pack/python run the default test command, `uv run pytest -q`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: go test -shuffle=on -tags e2e ./e2e/ -v
      # lighthouse runs its own pack/core: the installed copy must match pack/ exactly.
      # The diff goes to the log; stdin is empty, so init declines (exit 1) and writes
      # nothing. `|| true` keeps bash -e from ending the step before the diff is printed.
      - name: installed pack/core matches pack/
        run: |
          out=$(go run ./cmd/lighthouse init --upgrade </dev/null) || true
          printf '%s\n' "$out"
          test "$out" = "No changes."
