# CI for lighthouse: one job per domain (pack-python, go, web), each run only when ci/domains
# finds a changed path in it. Go runs as three parallel jobs, `go`, `go-test` and `go-e2e`; `canary` runs on Go and on
# pack-python changes. `pack-python` is one pytest run over tests/pack/python/ (tests/pack/python/conftest.py). Everything runs on
# Linux; macOS runs in macos.yml, as the gate before the release (#337). A `binary` job builds the
# SPA itself, embeds it in the Go binary and smoke-tests it, next to web instead of after it.
# A manual run (workflow_dispatch) turns every domain on, for the baseline measurement (#360).
name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      all-domains:
        type: boolean
        default: true
        description: Run every domain (web, pack-python, go), not only the changed ones.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.domains.outputs.web }}
      go: ${{ steps.domains.outputs.go }}
      pack-python: ${{ steps.domains.outputs.pack-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: domains
        # `shell: bash` runs with -o pipefail: a failed `git diff` must not look like an empty diff.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all-domains }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            { echo "web=$ALL"; echo "pack-python=$ALL"; echo "go=$ALL"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -z --name-only --no-renames "$BASE...$HEAD" | go run ./ci/domains classify --github-output "$GITHUB_OUTPUT"

  # Every PR carries a changelog fragment, also outside the domains; see docs/releasing.md.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: go run ./ci/changelog check --base "$BASE" --head "$HEAD"

  # Every PR, outside the domains too: a secret can land in any file (#194). The scan
  # covers the commits of the PR, base..head, so a secret added and removed again inside
  # the PR is red as well; same config as the pre-push hook in tools/hooks/. Then the tests
  # of that hook, with gitleaks present, so they cannot skip here.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: scan the commits of this PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --log-opts="$BASE..$HEAD" --config .gitleaks.toml --no-banner --redact --exit-code 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The go-test and go-e2e jobs have no gitleaks: here these tests run hard instead of
      # skipping. The hook tests in e2e/ build the lighthouse of this checkout themselves.
      - run: go test -race -shuffle=on ./internal/checkpointscan/... ./internal/cli/
        env:
          LIGHTHOUSE_REQUIRE_GITLEAKS: "1"
      - run: go test -race -shuffle=on -tags e2e -run 'TestPrePushScan|TestSecretScan' ./e2e/
        env:
          LIGHTHOUSE_REQUIRE_GITLEAKS: "1"

  # Every PR, without a domain condition: a linter can come unwired by a change anywhere (a pin,
  # a config, a workflow). See docs/lint-check.md; internal/cli/lint_self_test.go pins this job.
  lint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/lighthouse lint check

  pack-python:
    needs: changes
    if: needs.changes.outputs.pack-python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The `lighthouse_bin` fixture builds cmd/lighthouse: skills and pack/python call it (#274).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `lighthouse checkpoint-scan` reads its limits in-process (config.HostValue); this job builds the
      # binary for the hook test's `lighthouse_bin` fixture, found on PATH (#285).
      - name: build lighthouse
        run: |
          go build -o "$RUNNER_TEMP/bin/lighthouse" ./cmd/lighthouse
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The e2e tests of pack/python run the default test command, `uv run pytest -q`, so they need uv:
      # they run here and are skipped in go-e2e (needUV in e2e/e2e_test.go fails without uv under CI).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # `-n auto` (pytest-xdist): one worker per vCPU the runner has, 4 on ubuntu-latest for a
      # public repo. A fixed count would oversubscribe a smaller runner. Locally, a plain
      # `uv run pytest -q` stays serial.
      - run: uv run pytest -n auto tests/pack/python/
      - run: go test -race -shuffle=on -tags e2e ./e2e/ -run 'TestRedTestBlocksCommit|TestRedCommitComesBackAfter|TestDefaultCommandWithoutPytest' -v

  # Split per the measurements in #131 (issuecomment-6541734664, -6541786347): setup 13 s,
  # lint 30 s, builds 49 s (linux, windows, darwin), race compile 42 s, tests 34 s. `go` holds
  # lint, builds and pack-match (≈92 s); `go-test` holds the race tests (≈92 s). The e2e tests
  # build cmd/lighthouse themselves, 27 s cold: next to the race tests they took 44 s and made
  # that job 143 s, so they run in `go-e2e`.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: CGO_ENABLED=0 go build ./...
      # The release also ships windows and darwin: a platform-only break shows up here.
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      # lighthouse runs its own pack/core: the installed copy must match pack/ exactly.
      # The diff goes to the log; stdin is empty, so init declines (exit 1) and writes
      # nothing. `|| true` keeps bash -e from ending the step before the diff is printed.
      - name: installed pack/core matches pack/
        run: |
          out=$(go run ./cmd/lighthouse init --upgrade </dev/null) || true
          printf '%s\n' "$out"
          test "$out" = "No changes."
      # Reads pack/, internal, cmd and ci/literal-*: all inside the go domain.
      - name: literal grep
        run: |
          ci/literal-grep.sh
          LITERAL_DENYLIST=ci/literal-denylist-go.txt LITERAL_SKIP_TESTS=1 ci/literal-grep.sh internal cmd

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same flags as the Go part of [test_gate] command; internal/repopins/workflows_test.go pins it.
      - run: go test -race -shuffle=on ./...

  go-e2e:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tests that need uv (needUV) run in pack-python; with CI set they fail without uv.
      - run: go test -race -shuffle=on -tags e2e ./e2e/ -skip 'TestRedTestBlocksCommit|TestRedCommitComesBackAfter|TestDefaultCommandWithoutPytest' -v

  # One canary per blocking rule of every hook: each proves the rule blocks (#381). A missing
  # tool is a failure, never a skip; shellcheck comes from the pinned lib the test fetches.
  # The canaries of the imports gates (#383): each Stop hook, the built binary and the real
  # deptry, knip and `go mod tidy` against a fake repository per rule ID. Needs uv and npx, and
  # the network for the pinned tools; it also runs for a change under tests/pack/python/ (through
  # pack-python) or tests/pack/fixtures/ (through go); with CI set a missing tool fails the test, it never skips.
  canary:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.pack-python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # install-only: `golangci-lint run --version` is an unknown flag in v2, so no lint run here.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: build lighthouse
        run: |
          go build -o "$RUNNER_TEMP/bin/lighthouse" ./cmd/lighthouse
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: go test -race -tags canary ./internal/canary/ -v
      - run: uv run pytest -q tests/pack/python/test_canary.py
      - run: go test -race -tags canary ./internal/importcheck/
      - run: uv run pytest -q tests/pack/python/test_imports_gate_canary.py

  # A fresh init with every pack, and each hook it registers, on a PATH without python* (#285).
  # No setup-uv: Python is what this job proves is not needed.
  no-python:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.pack-python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/lighthouse" ./cmd/lighthouse
      - run: |
          mkdir -p "$RUNNER_TEMP/work"
          ci/no-python.sh "$RUNNER_TEMP/lighthouse" "$RUNNER_TEMP/work"

  # Runs on every PR, without a domain condition: the site tests also read pack/, internal/ and
  # build.yml, so a domain "only docs/site/" would be too narrow.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: go build -o "$RUNNER_TEMP/lighthouse" ./cmd/lighthouse
      - run: node --test "docs/site/test/*.test.mjs"
        env:
          LIGHTHOUSE_BIN: ${{ runner.temp }}/lighthouse

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The generated client must match web/openapi.json; `git status` also catches a new file.
      - run: npm run gen && git status --porcelain -- src/api && test -z "$(git status --porcelain -- src/api)"
      - run: npm run build

  # The binary with the real SPA embedded. Runs when web or go changed; it builds the SPA
  # itself, so it starts next to web instead of waiting for it.
  binary:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - run: CGO_ENABLED=0 go build ./cmd/lighthouse
      - run: ci/spa-smoke.sh ./lighthouse
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: LIGHTHOUSE_BIN="$GITHUB_WORKSPACE/lighthouse" npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
