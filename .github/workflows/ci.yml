# CI for lighthouse: one job per domain (python, go, web), each run only when ci/domains.py
# finds a changed path in it, and a `binary` job that builds the Go binary with the real SPA
# embedded and smoke-tests it.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.domains.outputs.web }}
      go: ${{ steps.domains.outputs.go }}
      python: ${{ steps.domains.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: domains
        # `shell: bash` runs with -o pipefail: a failed `git diff` must not look like an empty diff.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff -z --name-only --no-renames "$BASE...$HEAD" | python3 ci/domains.py classify --github-output "$GITHUB_OUTPUT"

  # Every PR carries a changelog fragment, also outside the domains; see docs/releasing.md.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/changelog.py check --base "$BASE" --head "$HEAD"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # `-n auto` (pytest-xdist): one worker per vCPU the runner has, 4 on ubuntu-latest for a
      # public repo. A fixed count would oversubscribe a smaller runner. Locally, a plain
      # `uv run pytest -q` stays serial.
      - run: uv run pytest -q -n auto
      - run: ci/literal-grep.sh

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: CGO_ENABLED=0 go build ./...
      # The release also ships windows and darwin: a platform-only break shows up here.
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      # Same flags as the Go part of [test_gate] command; tests/test_ci_go_test_pin.py pins it.
      - run: go test -race -shuffle=on ./...
      # The e2e tests of pack/python run the default test command, `uv run pytest -q`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: go test -race -shuffle=on -tags e2e ./e2e/ -v
      # lighthouse runs its own pack/core: the installed copy must match pack/ exactly.
      # The diff goes to the log; stdin is empty, so init declines (exit 1) and writes
      # nothing. `|| true` keeps bash -e from ending the step before the diff is printed.
      - name: installed pack/core matches pack/
        run: |
          out=$(go run ./cmd/lighthouse init --upgrade </dev/null) || true
          printf '%s\n' "$out"
          test "$out" = "No changes."

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The generated client must match web/openapi.json; `git status` also catches a new file.
      - run: npm run gen && git status --porcelain -- src/api && test -z "$(git status --porcelain -- src/api)"
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/web/dist

  # The binary with the real SPA embedded. Runs when web or go changed, also when web was
  # skipped; a failed web job blocks it.
  binary:
    needs: [changes, web]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true') && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: needs.web.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/web/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - if: needs.web.result != 'success'
        working-directory: web
        run: npm run build
      - run: CGO_ENABLED=0 go build ./cmd/lighthouse
      - run: ci/spa-smoke.sh ./lighthouse
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: LIGHTHOUSE_BIN="$GITHUB_WORKSPACE/lighthouse" npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
