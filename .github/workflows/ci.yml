# CI for lighthouse: one job per domain (python, go, web), each run only when ci/domains.py
# finds a changed path in it. Go runs as three parallel jobs, `go`, `go-test` and `go-e2e`, and
# Python as a matrix of three parts of the pytest suite (tests/conftest.py). Python, `go-test`
# and `go-e2e` run on Linux and macOS (#90). A `binary` job builds the SPA itself, embeds it in
# the Go binary and smoke-tests it, next to web instead of after it.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.domains.outputs.web }}
      go: ${{ steps.domains.outputs.go }}
      python: ${{ steps.domains.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: domains
        # `shell: bash` runs with -o pipefail: a failed `git diff` must not look like an empty diff.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff -z --name-only --no-renames "$BASE...$HEAD" | python3 ci/domains.py classify --github-output "$GITHUB_OUTPUT"

  # Every PR carries a changelog fragment, also outside the domains; see docs/releasing.md.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/changelog.py check --base "$BASE" --head "$HEAD"

  # Every PR, outside the domains too: a secret can land in any file (#194). The scan
  # covers the commits of the PR, base..head, so a secret added and removed again inside
  # the PR is red as well; same config as the pre-push hook in tools/hooks/. Then the tests
  # of that hook, with gitleaks present, so they cannot skip here.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: scan the commits of this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --log-opts="$BASE..$HEAD" --config .gitleaks.toml --no-banner --redact --exit-code 1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_pre_push_secret_scan.py tests/test_checkpoint_scan.py
        env:
          LIGHTHOUSE_REQUIRE_GITLEAKS: "1"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    # macOS runners are slower than ubuntu-latest (#90).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # `-n auto` (pytest-xdist): one worker per vCPU the runner has, 4 on ubuntu-latest for a
      # public repo. A fixed count would oversubscribe a smaller runner. Locally, a plain
      # `uv run pytest -q` stays serial. The suite is bound by cores (104 s on 4 vCPU, #151), so
      # each matrix job runs one third: tests/conftest.py splits it on the crc32 of the test id.
      # No `-q`: it hides the header, and under xdist only the header names the part (#163).
      - run: uv run pytest -n auto
        env:
          LIGHTHOUSE_PYTEST_SHARD: ${{ matrix.shard }}/3
      - if: matrix.shard == 1 && matrix.os == 'ubuntu-latest'
        run: ci/literal-grep.sh

  # Split per the measurements in #131 (issuecomment-6541734664, -6541786347): setup 13 s,
  # lint 30 s, builds 49 s (linux, windows, darwin), race compile 42 s, tests 34 s. `go` holds
  # lint, builds and pack-match (≈92 s); `go-test` holds the race tests (≈92 s). The e2e tests
  # build cmd/lighthouse themselves, 27 s cold: next to the race tests they took 44 s and made
  # that job 143 s, so they run in `go-e2e`.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: CGO_ENABLED=0 go build ./...
      # The release also ships windows and darwin: a platform-only break shows up here.
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      # lighthouse runs its own pack/core: the installed copy must match pack/ exactly.
      # The diff goes to the log; stdin is empty, so init declines (exit 1) and writes
      # nothing. `|| true` keeps bash -e from ending the step before the diff is printed.
      - name: installed pack/core matches pack/
        run: |
          out=$(go run ./cmd/lighthouse init --upgrade </dev/null) || true
          printf '%s\n' "$out"
          test "$out" = "No changes."

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same flags as the Go part of [test_gate] command; tests/test_ci_go_test_pin.py pins it.
      - run: go test -race -shuffle=on ./...

  go-e2e:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The e2e tests of pack/python run the default test command, `uv run pytest -q`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: go test -race -shuffle=on -tags e2e ./e2e/ -v

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The generated client must match web/openapi.json; `git status` also catches a new file.
      - run: npm run gen && git status --porcelain -- src/api && test -z "$(git status --porcelain -- src/api)"
      - run: npm run build

  # The binary with the real SPA embedded. Runs when web or go changed; it builds the SPA
  # itself, so it starts next to web instead of waiting for it.
  binary:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - run: CGO_ENABLED=0 go build ./cmd/lighthouse
      - run: ci/spa-smoke.sh ./lighthouse
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: LIGHTHOUSE_BIN="$GITHUB_WORKSPACE/lighthouse" npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
