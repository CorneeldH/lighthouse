# Build for lighthouse: five binaries from a tag, a version check, and a GitHub release.
# Binaries go to $RUNNER_TEMP/dist, never into the checkout: the version comes from VCS build
# info and an untracked file would make the binary report `dev`. The binary embeds the
# placeholder SPA, so there is no npm build here.
name: build

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "build: '$TAG' is not a version tag" >&2; exit 1
          fi
          case "$TAG" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A dirty tree makes the binary report `dev` instead of the tag.
      - run: test -z "$(git status --porcelain)"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          NAME="lighthouse_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then NAME="$NAME.exe"; fi
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/dist/$NAME" ./cmd/lighthouse
      - name: Check version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/dist/lighthouse_linux_amd64" version)
          test "$out" = "lighthouse $TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/dist/

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Publish
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/dist" && sha256sum lighthouse_* > SHA256SUMS)
          if ! python3 ci/changelog.py notes "$TAG" > "$RUNNER_TEMP/notes.md"; then
            if [ "$PRERELEASE" = true ]; then
              echo "Pre-release build of $TAG for testing; not a release." > "$RUNNER_TEMP/notes.md"
            else
              echo "publish: no CHANGELOG.md section for $TAG" >&2; exit 1
            fi
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$RUNNER_TEMP"/dist/*
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}" "$RUNNER_TEMP"/dist/*
          fi
