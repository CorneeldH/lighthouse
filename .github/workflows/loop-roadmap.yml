# Loop roadmap: the planned steps and handoffs of the loop map (docs/site/data/loop.json) match
# the open issues labelled `loop`; on a PR, a PR that closes a `loop` issue also updates the map.
# See ci/loop_roadmap.py.
name: loop-roadmap

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - "docs/site/data/loop.json"
      - "ci/loop_roadmap.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the map with the open loop issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/loop_roadmap.py ${{ github.event_name == 'pull_request' && format('--pr {0}', github.event.pull_request.number) || '' }}
