name: Bug report
description: Something in lighthouse does not work as described.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A suspected security vulnerability does **not** belong here:
        see [SECURITY.md](https://github.com/CorneeldH/lighthouse/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands or prompts, in order. Paste error output as text.
      placeholder: |
        1. lighthouse init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lighthouse version
      description: The output of `lighthouse version`.
      placeholder: lighthouse v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version, and WSL if that applies.
      placeholder: macOS 15.2 / Ubuntu 24.04 / Windows 11 + WSL 2
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: The coding agent lighthouse ran in.
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Other (say which below)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Harness version, relevant parts of `lighthouse.toml`, logs.
