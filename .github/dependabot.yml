# Seeded by `lighthouse init`; this file belongs to the repo and is never overwritten again.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/lighthouse-*.yml"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/web"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
