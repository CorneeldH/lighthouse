# Tool -> the units in this package that need it. `lighthouse init` reports a
# missing tool with these names; it does not stop on it.
git = ["go-lint-gate", "go-standard"]
go = ["go-lint-gate", "go-standard"]
gofmt = ["gofmt-check", "go-standard"]
golangci-lint = ["go-lint-gate", "go-standard"]
jq = ["gofmt-check", "go-lint-gate"]
python3 = ["go-lint-gate", "go-standard"]
