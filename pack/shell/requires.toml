# Tool -> the units in this package that need it. `lighthouse init` reports a
# missing tool with these names; it does not stop on it.
curl = ["shell-lint-check (download of the pinned binary)"]
git = ["shell-lint-check", "shellcheck-repo", "shell-standard"]
jq = ["shell-lint-check"]
tar = ["shell-lint-check (download of the pinned binary)"]
xz = ["shell-lint-check (download of the pinned binary)"]
