# Tool -> the units in this package that need it. `lighthouse init` reports a
# missing tool with these names; it does not stop on it.
curl = ["shellcheck (download of the pinned binary)"]
git = ["shellcheck", "shellcheck-repo"]
jq = ["shellcheck"]
python3 = ["shellcheck", "shellcheck-repo"]
sha256sum = ["shellcheck (download of the pinned binary)"]
tar = ["shellcheck (download of the pinned binary)"]
tomllib = ["shellcheck", "shellcheck-repo"]
xz = ["shellcheck (download of the pinned binary)"]
