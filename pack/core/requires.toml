# Tool -> the units in this package that need it. `lighthouse init` reports a
# missing tool with these names; it does not stop on it.
git = ["main-commit-guard"]
jq = ["main-commit-guard"]
python3 = ["main-commit-guard", "lighthouse_lib.config", "lighthouse_lib.datadir", "lighthouse_lib.headings", "lighthouse_lib.protocol", "lighthouse_lib.artefacts"]
tomllib = ["lighthouse_lib.config", "lighthouse_lib.headings", "lighthouse_lib.protocol", "lighthouse_lib.artefacts"]
