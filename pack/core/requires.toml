python3 = ["main-commit-guard", "lighthouse_lib.config", "lighthouse_lib.datadir", "lighthouse_lib.headings", "lighthouse_lib.protocol", "lighthouse_lib.artefacts", "post_artefact", "board_start", "plan_review_record", "review_pair"]
tomllib = ["lighthouse_lib.config", "lighthouse_lib.headings", "lighthouse_lib.protocol", "lighthouse_lib.artefacts", "post_artefact", "board_start", "plan_review_record", "review_pair"]
gh = ["post_artefact", "board_start"]
