# The release lane. When an issue closes as `completed`, the GitHub App from `[ci]`
# removes the `[labels] blocked_issue` label from every open issue that waited on it
# and has no other open blocker, with a comment on that issue and one comment back on
# the closed issue. The closed issue stays the only source: the lane reads only
# `dependencies/blocking` and `dependencies/blocked_by`.
#
# A workflow and not a step in `lighthouse-close-issue`: an issue also closes through a
# PR merge or by hand, and a session has no bot token. The skill checks afterwards.
# `workflow_dispatch` with an issue number is the fallback for a missed or red run. The
# logic lives in `lighthouse unblock-dependents`; the YAML stays thin and only fetches the binary
# (`Get lighthouse`).
#
# `lighthouse init` fills every `@@<key>@@` from `lighthouse.toml`; without the `[ci]`
# bot keys it does not install this workflow.
name: Unblock dependents
# The issue number in the run name: `lighthouse-close-issue` finds the run by it.
run-name: "Unblock dependents #${{ github.event.issue.number || inputs.issue }}"

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue:
        description: "The closed issue whose dependents should be released"
        required: true
        type: number

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  unblock:
    # Only `completed` releases: at job level, so a `not_planned` provisions no
    # runner. The script checks it again (a dispatch can be anything).
    if: >-
      github.ref == 'refs/heads/@@forge.default_branch@@' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.issue.state_reason == 'completed')
    runs-on: @@ci.runs_on@@
    permissions:
      # Writes go through the App token; GITHUB_TOKEN only reads the checkout.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Which lighthouse this project runs: the first `version =` of the manifest. `dev` with a
      # `cmd/lighthouse` in the checkout is lighthouse itself: it builds its own binary, so Go
      # is needed only then.
      - name: Which lighthouse
        id: lighthouse
        run: |
          version=$(sed -n 's/^version = "v*\([^"]*\)"$/\1/p' .lighthouse/manifest.toml | head -n 1)
          if [ "$version" = dev ] && [ -f cmd/lighthouse/main.go ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.lighthouse.outputs.build == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The binary of the release the manifest names, checked against SHA256SUMS; a runner
      # that is not Linux or macOS on x64 or arm64, or a `dev` manifest without the source to
      # build, is an error: a lane that runs nothing leaves the labels on. The release is
      # public, so GITHUB_TOKEN is enough; the App token below only writes.
      - name: Get lighthouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "v*\([^"]*\)"$/\1/p' .lighthouse/manifest.toml | head -n 1 || true)
          if [ -z "$version" ]; then
            echo "::error::no version = line in .lighthouse/manifest.toml"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          if [ "$version" = dev ]; then
            if [ ! -f cmd/lighthouse/main.go ]; then
              echo "::error::.lighthouse/manifest.toml says version = \"dev\", but this checkout has no cmd/lighthouse to build"
              exit 1
            fi
            go build -o "$RUNNER_TEMP/bin/lighthouse" ./cmd/lighthouse
          else
            case "$RUNNER_OS" in
              Linux) os=linux ;;
              macOS) os=darwin ;;
              *) echo "::error::no lighthouse binary for runner OS $RUNNER_OS"; exit 1 ;;
            esac
            case "$RUNNER_ARCH" in
              X64) arch=amd64 ;;
              ARM64) arch=arm64 ;;
              *) echo "::error::no lighthouse binary for runner architecture $RUNNER_ARCH"; exit 1 ;;
            esac
            gh release download "v$version" \
              --repo CorneeldH/lighthouse \
              --pattern "lighthouse_${os}_${arch}" --pattern SHA256SUMS \
              --dir "$RUNNER_TEMP/bin"
            (
              cd "$RUNNER_TEMP/bin"
              if command -v sha256sum >/dev/null; then
                sha256sum --check --ignore-missing SHA256SUMS
              else
                shasum -a 256 -c --ignore-missing SHA256SUMS
              fi
            )
            mv "$RUNNER_TEMP/bin/lighthouse_${os}_${arch}" "$RUNNER_TEMP/bin/lighthouse"
            chmod +x "$RUNNER_TEMP/bin/lighthouse"
          fi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: App token for labels and comments
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.@@ci.bot_client_id_var@@ }}
          private-key: ${{ secrets.@@ci.bot_private_key_secret@@ }}
          permission-issues: write

      # The issue number goes through env, never as `${{ }}` in `run:`.
      - name: Release dependents
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: lighthouse unblock-dependents --issue "$ISSUE"
