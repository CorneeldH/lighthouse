# gitleaks configuration (#194): one config for the pre-push hook and CI.
#
# Allowlists work on the matched text, never on a path: a `paths` entry makes a whole
# file invisible, including a real secret that later lands in it. The one exception
# is `.entire/metadata/`, below.
title = "lighthouse"

[extend]
useDefault = true

# generic-api-key reads `TriggerKey, triggerHandoff+"` as a key with a value. It is
# a Go expression in internal/dispatch/decide.go, also in history (bf285594). Scoped
# to the rule and to this exact match, so a real key on that line stays red.
[[allowlists]]
description = "Go expression row.TriggerKey in internal/dispatch/decide.go, not a secret"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^row\.TriggerKey, triggerHandoff\+"$''']

# generic-api-key reads `"oauth-2025-04-20","interleaved-thinking-2025-05-14"` as a key
# with a value: that is the name of the Anthropic beta header and a feature date, in
# every Claude transcript. Scoped to the rule and to this exact match, so a real key on
# that line stays red.
[[allowlists]]
description = "Anthropic beta-header name and feature date in transcripts, not a secret"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^oauth-2025-04-20","interleaved-thinking-2025-05-14"$''']

# entire's local transcript cache. `.entire/.gitignore` excludes it, so it can never
# be committed: skipping it hides nothing in the repo. Without this entry a local
# `gitleaks dir .` is red on conversation text, and a gate that is red for no reason
# gets ignored. Pushed checkpoints do not live here (they are refs/entire/...), so
# this entry never blinds the pre-push scan of a checkpoint.
[[allowlists]]
description = "entire's local transcript cache (gitignored, never in a commit)"
paths = ['''^\.entire/metadata/''']
