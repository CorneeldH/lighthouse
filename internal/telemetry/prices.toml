# Prices in USD per million tokens. `as_of` reads as "valid from": the lookup takes
# the row with the greatest as_of <= the message time (the first row for older messages).
# Only the literal model id from message.model matches.
# Source: official Anthropic pricing page, read 2026-11-24.

[[price]]
model = "claude-sonnet-5-5"
as_of = 2026-11-24
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 2.0
output = 10.0
cache_read = 0.10
cache_write_5m = 2.50
cache_write_1h = 4.0

[[price]]
model = "claude-opus-5-5"
as_of = 2026-11-24
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 4.0
output = 20.0
cache_read = 0.20
cache_write_5m = 5.0
